<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D3 Charts Dashboard - TV Power Consumption</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="dashboard-header">
        <h1>D3 Charts Dashboard</h1>
        <p>TV power consumption</p>
    </header>

    <main class="dashboard-container">
        <section class="chart-card">
            <h2>1. Energy Consumption vs Star Rating</h2>
            <div id="chart-scatter" class="svg-container"></div>
        </section>

        <section class="chart-card">
            <h2>2. Annual Electricity Spot Price (1998–2024)</h2>
            <div id="chart-line" class="svg-container"></div>
        </section>

        <section class="chart-card">
            <h2>3. Mean Energy Consumption by Screen Tech (55-Inch TVs)</h2>
            <div id="chart-bar" class="svg-container"></div>
        </section>

        <section class="chart-card">
            <h2>4. Energy Consumption Proportion by Screen Tech (All Sizes)</h2>
            <div id="chart-donut" class="svg-container"></div>
        </section>
    </main>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="js/scatter.js"></script>
    <script src="js/line.js"></script>
    <script src="js/bar.js"></script>
    <script src="js/donut.js"></script>
</body>
</html>
